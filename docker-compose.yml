version: '3.8'


services:
  db:
    image: postgres:16-alpine
    container_name: postgres_crm
    restart: always
    environment:
      POSTGRES_USER: gustavo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mini_crm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
